<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edit comment – CrackMap</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #f5f3ef; color: #2d2a26; }
    header { height: 48px; display: flex; align-items: center; padding: 0 16px;
             background: #2d2a26; font-weight: 600; }
    header a { color: #fff; text-decoration: none; }
    main { max-width: 640px; margin: 0 auto; padding: 16px; }
    textarea { width: 100%; box-sizing: border-box; padding: 8px; font: inherit; }
    .errorlist { color: #b00020; padding-left: 16px; }
    button { margin-top: 8px; padding: 8px 16px; font: inherit; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <header><a href="{{ comment.crack.get_absolute_url }}#comments">← Back to crack</a></header>
  <main>
    <h1>Edit comment</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.text.errors }}
      {{ form.text }}
      <button type="submit">Save</button>
      <a href="{{ comment.crack.get_absolute_url }}#comments">Cancel</a>
    </form>
  </main>
</body>
</html>
