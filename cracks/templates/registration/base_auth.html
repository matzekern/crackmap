<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %} – CrackMap</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #f5f3ef; color: #2d2a26; }
    header { height: 48px; display: flex; align-items: center; padding: 0 16px;
             background: #2d2a26; font-weight: 600; }
    header a { color: #fff; text-decoration: none; }
    main { max-width: 360px; margin: 40px auto; padding: 24px; background: #fff; border-radius: 8px; }
    h1 { margin-top: 0; font-size: 24px; }
    label { display: block; font-weight: 600; margin: 12px 0 4px; }
    input { width: 100%; box-sizing: border-box; padding: 8px; font: inherit; }
    .helptext, .helptext ul { font-size: 12px; color: #6b655c; margin: 4px 0 0; padding-left: 16px; }
    .errorlist { color: #b00020; font-size: 13px; padding-left: 16px; margin: 4px 0; }
    button { margin-top: 16px; width: 100%; padding: 10px; font: inherit; font-weight: 600;
             background: #2d2a26; color: #fff; border: 0; border-radius: 6px; cursor: pointer; }
    .switch { margin-top: 16px; font-size: 14px; text-align: center; }
  </style>
</head>
<body>
  <header><a href="{% url 'cracks:map' %}">← CrackMap</a></header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
